include:
  - docker-compose-mongodb.yml
  - docker-compose-api.yml
  - docker-compose-mlflow.yml
  - docker-compose-airflow.yml
  - docker-compose-promgraf.yml

volumes:
  postgres-db-volume:
  mongo-db-volume:
  minio-volume:
  mlflow-volume:
  airflow-logs-volume:
  airflow-plugins-volume:

networks:
  mlops-network:
    driver: bridge
    name: mlops-network