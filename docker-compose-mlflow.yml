services:
  mlflow-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflow
    networks:
      - mlops-network
    restart: always

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    networks:
      - mlops-network
    ports:
      - "9000:9000"
    volumes:
      - ./data/minio-data:/data
    restart: always

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpass@mlflow-db/mlflow
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    networks:
      - mlops-network
    ports:
      - "5000:5000"
    depends_on:
      - mlflow-db
      - minio

volumes:
  minio-data:

networks:
  mlops-network:
    driver: bridge
    name: mlops-network
