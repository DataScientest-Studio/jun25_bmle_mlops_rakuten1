services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlops-mlflow
    environment:
      - MLFLOW_HOST=mlflow    
    volumes:
      - ./data/mlflow:/app
    networks:
      - mlops-network
    ports:
      - "5000:5000"
    restart: always

networks:
  mlops-network:
    driver: bridge
    name: mlops-network