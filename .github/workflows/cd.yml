name: CD - Build & Deploy (Sequential)

on:
  workflow_run:
    workflows: ["CI - Continuous Integration (lint, format and test python sources)"]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # On ne peut pas transformer en minuscule ici directement

jobs:
  build-sequential:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 0. NOM REPO EN MINUSCULES
      - name: 🔡 Mettre le nom du repo en minuscules
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          
      # 1. OPTIMISATION INITIALE : On fait le vide dès le départ
      - name: 🧹 Libérer de l'espace disque (Free Disk Space)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # SERVICE 1 : TRAINER (Probablement le plus gros)
      # ------------------------------------------------------------------------
      # - name: 🏗️ Build & Push - TRAINER
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: docker/train/Dockerfile
      #     push: true
      #     tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-trainer:latest
      #     platforms: linux/amd64,linux/arm64
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # - name: 🧹 Nettoyage post-Trainer
      #   run: |
      #     docker system prune -a -f --volumes
      #     docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 2 : PREDICTOR
      # ------------------------------------------------------------------------
      # - name: 🏗️ Build & Push - PREDICTOR
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: docker/predict/Dockerfile
      #     push: true
      #     tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-predictor:latest
      #     platforms: linux/amd64,linux/arm64
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # - name: 🧹 Nettoyage post-Predictor
      #   run: |
      #     docker system prune -a -f --volumes
      #     docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 3 : API (FASTAPI)
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-api:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 Nettoyage post-API
        run: docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 4 : STREAMLIT (FRONTEND)
      # ------------------------------------------------------------------------
      # - name: 🏗️ Build & Push - STREAMLIT
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: docker/streamlit/Dockerfile
      #     push: true
      #     tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-streamlit:latest
      #     platforms: linux/amd64,linux/arm64
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # - name: 🧹 Nettoyage post-Streamlit
      #   run: docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 5 : AIRFLOW
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - AIRFLOW
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/airflow/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-airflow:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 Nettoyage post-Airflow
        run: docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 6 : MLFLOW
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - MLFLOW
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mlflow/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-mlflow:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # SERVICE 7 : MONGODB (Souvent une image officielle customisée ?)
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - MONGODB
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mongodb/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-mongodb:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # SERVICE 8 : PROMETHEUS
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - PROMETHEUS
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/prometheus/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rakuten-prometheus:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # JOB 2 : DÉPLOIEMENT (DEPLOY SSH)
  # ==============================================================================
  deploy-ssh:
    needs: build-sequential
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Transfert configs (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_ORACLE }}
          username: ${{ secrets.USER_ORACLE }}
          key: ${{ secrets.SSH_KEY_ORACLE }}
          source: "docker-compose*.yml"
          target: "/home/${{ secrets.USER_ORACLE }}/app"

      - name: Déploiement SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_ORACLE }}
          username: ${{ secrets.USER_ORACLE }}
          key: ${{ secrets.SSH_KEY_ORACLE }}
          script: |
            cd /home/${{ secrets.USER_ORACLE }}/app
            
            echo "🔑 Login Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling images..."
            export REGISTRY=ghcr.io/${{ github.repository }}
            
            # Export variables pour tous les services
            # export TRAINER_IMAGE=$REGISTRY/rakuten-trainer:latest
            # export PREDICTOR_IMAGE=$REGISTRY/rakuten-predictor:latest
            export API_IMAGE=$REGISTRY/rakuten-api:latest
            # export STREAMLIT_IMAGE=$REGISTRY/rakuten-streamlit:latest
            export AIRFLOW_IMAGE=$REGISTRY/rakuten-airflow:latest
            export MLFLOW_IMAGE=$REGISTRY/rakuten-mlflow:latest
            export MONGO_IMAGE=$REGISTRY/rakuten-mongodb:latest
            export PROMETHEUS_IMAGE=$REGISTRY/rakuten-prometheus:latest

            docker compose pull
            
            echo "🚀 Restarting services..."
            docker compose up -d --remove-orphans
            
            echo "🧹 Cleaning up server..."
            docker image prune -f
