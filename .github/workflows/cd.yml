name: CD - Build & Deploy (Sequential)

on:
  workflow_run:
    workflows: ["CI - Continuous Integration (lint, format and test python sources)"]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-sequential:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🔡 Mettre le nom du repo en minuscules
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- VERIFICATION & NETTOYAGE DISQUE ---
      - name: Check & Free Disk Space
        run: |
          FREE_SPACE=$(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//')
          echo "Espace libre actuel : ${FREE_SPACE}Go"
          if [ "$FREE_SPACE" -lt 25 ]; then
            echo "⚠️ Espace insuffisant. Nettoyage activé."
            echo "CLEAN_NEEDED=true" >> $GITHUB_ENV
          else
            echo "✅ Espace suffisant."
            echo "CLEAN_NEEDED=false" >> $GITHUB_ENV
          fi

      - name: 🧹 Libérer de l'espace disque (Si nécessaire)
        if: env.CLEAN_NEEDED == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false # On garde les images de base pour accélérer
          swap-storage: false

      - name: Récupération du code source
        uses: actions/checkout@v4

      # - name: Configuration de QEMU (Multi-Arch)
      #   uses: docker/setup-qemu-action@v3

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # SERVICE 1 : TRAINER (Désactivé)
