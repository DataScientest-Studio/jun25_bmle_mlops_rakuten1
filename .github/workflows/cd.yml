      #     platforms: linux/amd64
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # - name: 🧹 Nettoyage post-Predictor
      #   run: |
      #     docker system prune -a -f --volumes
      #     docker builder prune -f

      # ------------------------------------------------------------------------
      # SERVICE 3 : API (FASTAPI) - ACTIF
      # ------------------------------------------------------------------------
      - name: 🏗️ Build & Push - API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/rakuten-api:latest
          # platforms: linux/amd64,linux/arm64 <-- DESACTIVÉ TEMPORAIREMENT
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧹 Nettoyage post-API
        run: docker builder prune -f

