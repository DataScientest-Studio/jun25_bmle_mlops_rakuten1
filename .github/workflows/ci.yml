# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI - Continuous Integration (lint, format and test python sources)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: python -m pip install --upgrade uv

    - name: Create virtual environment via uv
      run: uv venv

    - name: Synchronize dependencies (all extras) with uv
      run: |
        source .venv/bin/activate
        uv sync --extra all

    - name: Lint and format with ruff
      run: |
        source .venv/bin/activate
        ruff check . --output-format=github
        ruff format . --diff
      continue-on-error: true

    # 1. Construire l'image depuis le dossier tests
    # -f indique le chemin du fichier, le point final (.) indique le contexte racine
    - name: Build Docker image from tests folder
      run: docker build -f tests/Dockerfile -t test_api_image .

    # 2. Lancer le conteneur avec un nom préfixé (test_...)
    - name: Run Test API container
      run: |
        docker run -d --name test_api_container \
          -p 8000:8000 \
          -p 8080:8080 \
          -e PORT_TRAIN=8000 \
          -e PORT_PREDICT=8080 \
          test_api_image

    # 3. Attendre que l'API soit prête (Healthcheck sur /hello ou /)
    - name: Wait for API to be ready
      run: |
        echo "Waiting for API to be ready..."
        # On attend que l'endpoint hello (ou root) réponde
        timeout 30s bash -c 'until curl --silent --fail http://localhost:8000/ > /dev/null; do sleep 2; done'
        echo "API is ready!"

    - name: Test with pytest
      run: |
        source .venv/bin/activate
        if [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
          pytest
        else
          echo "No tests found, skipping pytest"
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
