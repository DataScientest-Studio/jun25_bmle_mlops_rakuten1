# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI - Continuous Integration (lint, format and test python sources)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- VERIFICATION & NETTOYAGE DISQUE ---
      - name: Check & Free Disk Space
        run: |
          # Récupère l'espace libre en Go sur la racine
          FREE_SPACE=$(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//')
          echo "Espace libre actuel : ${FREE_SPACE}Go"
          
          # Seuil à 25Go. Si on a moins, on lance le grand nettoyage.
          if [ "$FREE_SPACE" -lt 25 ]; then
            echo "⚠️ Espace insuffisant (<25Go). Lancement du nettoyage..."
            echo "CLEAN_NEEDED=true" >> $GITHUB_ENV
          else
            echo "✅ Espace suffisant."
            echo "CLEAN_NEEDED=false" >> $GITHUB_ENV
          fi

      - name: 🧹 Libérer de l'espace disque (Si nécessaire)
        if: env.CLEAN_NEEDED == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create virtual environment via uv
        run: uv venv

      - name: Synchronize dependencies (all extras) with uv
        run: |
          source .venv/bin/activate
          uv sync --extra all

      - name: Lint and format with ruff
        run: |
          source .venv/bin/activate
          ruff check . --output-format=github
          ruff format . --diff
        continue-on-error: true

      # 1. Construire l'image depuis le dossier tests
      # -f indique le chemin du fichier, le point final (.) indique le contexte racine
      - name: Build Docker image from tests folder
        run: docker build -f tests/Dockerfile -t test_api_image .

      # 2. Lancer le conteneur avec un nom préfixé (test_...)
      - name: Run Test API container
        run: |
          docker run -d --name test_api_container \
            -p 8000:8000 \
            -p 8080:8080 \
            -e PORT_TRAIN=8000 \
            -e PORT_PREDICT=8080 \
            test_api_image

      # 3. Attendre que l'API soit prête (Healthcheck sur /hello ou /)
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          # On tente pendant 120s. Si ça échoue, on continue pour afficher les logs juste après
          timeout 120s bash -c 'until curl --silent --fail http://localhost:8000/ > /dev/null; do sleep 2; done' || true
          
          # Vérification finale et affichage des logs en cas d'erreur
          if ! curl --silent --fail http://localhost:8000/ > /dev/null; then
            echo "❌ API failed to start within timeout."
            echo "=== CONTAINER LOGS ==="
            docker logs test_api_container
            echo "======================"
            exit 1
          fi
          echo "✅ API is ready!"


      - name: Test with pytest
        run: |
          source .venv/bin/activate
          if [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            pytest
          else
            echo "No tests found, skipping pytest"
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
