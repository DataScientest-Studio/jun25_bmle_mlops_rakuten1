[project]
name = "mlops-rakuten"
version = "0.1.0"
description = "Plateforme MLOps Rakuten - ML Pipeline avec FastAPI et MongoDB"
readme = "README.md"
requires-python = "==3.11.*"
license = {text = "MIT"}
authors = [{name = "MLOps Team", email = "mlops@rakuten.com"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

# ============================================================================
# DÉPENDANCES DE BASE (CORE)
# ============================================================================
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]

# --- API & SERVING ---
api = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.6",
    "prometheus_fastapi_instrumentator>=6.1.0",
    "httpx>=0.25.0", # Requis pour TestClient et requêtes internes
    "requests>=2.31.0,<3.0.0",
]

# --- DATABASE (MongoDB) ---
database = [
    "pymongo>=4.6.0,<5.0.0", # Compatible Mongo 7
    "motor>=3.3.0,<4.0.0",
    "beanie>=1.23.0,<2.0.0",
]

# --- DATA SCIENCE (ETL + TRAINING + EVAL) ---
# Fusion intelligente de vos anciens groupes 'etl' et 'datascience' pour cohérence
datascience = [
    "pandas>=2.1.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "beautifulsoup4>=4.11.0",
    "tqdm>=4.66.0",
    "Pillow>=10.0.0,<11.0.0",
    "PyYAML>=6.0",
    "xgboost>=2.0.0,<3.0.0",
    # Visualisation
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    # Deep Learning (Torch Configuré via uv.sources plus bas)
    "torch>=2.1.0,<3.0.0",
    "torchvision>=0.16.0,<1.0.0",
    # Monitoring Data Drift
    "evidently==0.6.7",
]
# Alias 'etl' pointant vers datascience pour rétro-compatibilité scripts
etl = ["mlops-rakuten[datascience]"]

# --- ORCHESTRATION ---
airflow = [
    "apache-airflow>=2.8.0,<3.0.0",
    "apache-airflow-providers-mongo>=3.5.0",
    "apache-airflow-providers-docker>=3.9.0",
    "apache-airflow-providers-http>=4.7.0",
    "apache-airflow-providers-celery>=3.5.0",
]

# --- MLFLOW SERVEUR (Container isolé) ---
mlflow = [
    "mlflow>=2.9.0,<3.0.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.0",
]

# --- MLFLOW CLIENT (Pour API/Training) ---
mlflow-client = [
    "mlflow-skinny>=2.9.0,<3.0.0",
]

# --- MONITORING (Prometheus/Grafana) ---
monitoring = [
    "prometheus-client>=0.19.0",
    "grafana-client>=3.5.0",
    "psutil>=5.9.0",
]

# --- DEV & TESTS ---
dev = [
    "ruff>=0.8.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pre-commit>=3.5.0",
    "mkdocs>=1.5.0",
]

# ============================================================================
# BUILD SYSTEM (Hatchling - Moderne)
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# CONFIGURATIONS OUTILS (Restaurées)
# ============================================================================

# --- PYTEST ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --disable-warnings"
pythonpath = ["."]

# --- RUFF (Linter & Formatter) ---
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = ["E501"] # Line too long (géré par formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- MYPY (Type Checker) ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false # Permissif pour le moment
ignore_missing_imports = true

# --- COVERAGE ---
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================================================
# CONFIGURATION UV (PyTorch GPU/CPU)
# ============================================================================
[tool.uv.sources]
torch = [
  # Linux : CUDA 12.1 (Stable)
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
  # Windows : CUDA 12.1 (Compatible)
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
  # Mac : CPU (auto)
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
