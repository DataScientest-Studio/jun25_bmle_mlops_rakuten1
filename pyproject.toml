[project]
name = "mlops-rakuten"
version = "0.1.0"
description = "Plateforme MLOps Rakuten - ML Pipeline avec FastAPI et MongoDB"
readme = "README.md"
requires-python = "==3.11.*"
license = {text = "MIT"}
authors = [{name = "MLOps Team", email = "mlops@rakuten.com"}]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# ============================================================================
# DÉPENDANCES DE BASE (CORE)
# ============================================================================
dependencies = [
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0",
    # Data Science Core (Versions unifiées ici pour éviter conflits)
    "pandas>=2.1.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[project.optional-dependencies]

# --- API & SERVING ---
api = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.6",
    "prometheus_fastapi_instrumentator>=6.1.0",
    "requests>=2.31.0,<3.0.0", # Utile pour les tests API aussi
]

# --- DATABASE (MongoDB) ---
database = [
    "pymongo>=4.6.0,<5.0.0", # Compatible Mongo 7
    "motor>=3.3.0,<4.0.0",
    "beanie>=1.23.0,<2.0.0",
]

# --- ETL & TRAINING ---
# Hérite implicitement de pandas/numpy/sklearn définis dans dependencies
etl = [
    "beautifulsoup4>=4.11.0",
    "tqdm>=4.66.0",
    "Pillow>=10.0.0,<11.0.0",
    "PyYAML>=6.0",
    "xgboost>=2.0.0,<3.0.0",
    # Version spécifique PyTorch (CPU par défaut, GPU via index uv si besoin)
    "torch>=2.1.0,<3.0.0",
    "torchvision>=0.16.0,<1.0.0",
    # Version figée pour compatibilité code existant
    "evidently==0.6.7",
]

# --- ORCHESTRATION ---
airflow = [
    "apache-airflow>=2.8.0,<3.0.0",
    "apache-airflow-providers-mongo>=3.5.0",
    "apache-airflow-providers-docker>=3.9.0",
]

# --- MLFLOW ---
mlflow = [
    "mlflow>=2.9.0,<3.0.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.0",
]

# --- DEV & TESTS ---
dev = [
    "ruff>=0.8.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0", # Requis pour TestClient FastAPI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Config Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --disable-warnings"
pythonpath = ["."]  # Ajoute la racine au path pour les tests locaux

# Config Ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv.sources]
torch = [
  # Linux : On force CUDA 12.1 (très stable et dispo)
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
  # Windows : On force aussi CUDA 12.1 (car dispo sous Windows !)
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
  # Mac : CPU par défaut (géré par PyPI standard)
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

